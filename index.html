    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Team VoidDev - a professional development team creating innovative web solutions and digital experiences. Frontend, backend and UI/UX design."
    />

    <title>Team VoidDev | Professional Development Team</title>
    <!--
      Run before the document loads: browsers default to
      history.scrollRestoration = "auto", which re-applies the previous offset
      on refresh and makes the page reopen halfway down. Opting out here (a
      module script is deferred and would be too late) hands control to
      <ScrollManager />, which honours explicit #hash deep links instead.
    -->
    <script>
      if ("scrollRestoration" in window.history) {
        window.history.scrollRestoration = "manual";
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
